[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lwm"
version = "0.1.0"
description = "CLI for LLM-WorkMem: init wiki trees and track raw/ against files.log"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ethan" }]
keywords = ["llm", "llm-workmem", "knowledge-base", "mcp", "code-graph", "working-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Documentation",
]
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
# Marker extra — installing ``lwm[cbmem]`` is a no-op today, but the
# extra name documents that cbmem is a vendored, system-level dependency
# whose installer lives at ``automation/install-cbmem.sh``.
cbmem = []

[project.urls]
Homepage = "https://github.com/EthanLau1/LLM-WorkMem"
Source = "https://github.com/EthanLau1/LLM-WorkMem"
Issues = "https://github.com/EthanLau1/LLM-WorkMem/issues"
Changelog = "https://github.com/EthanLau1/LLM-WorkMem/blob/main/CHANGELOG.md"

[project.scripts]
lwm = "lwm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lwm", "adapters", "mcp"]
exclude = [
    # These are workstation-specific outputs generated by `lwm adapters`.
    # The wheel ships the generator and hook code, not one machine's paths.
    "adapters/*.md",
    "adapters/*.mdc",
    "adapters/*.sh",
    "adapters/traerules",
    "adapters/adapter-manifest.json",
]

[tool.hatch.build.targets.wheel.force-include]
# Keep the host companion in the self-contained runtime wheel.  It is an
# extension resource, not an importable Python package.
"integrations/ide-companion" = "lwm/resources/ide-companion"

[tool.hatch.build.targets.sdist]
# Runtime-owned data is represented by external symlinks in this checkout.
# It is not source code and must not make a portable source archive invalid.
exclude = [
    "llms.txt",
    "llms.json",
    "llms-full.txt",
    "wiki",
    "automation",
    "raw/**",
    "state/**",
    "global/**",
    "projects/**",
    ".codebase-memory/**",
    ".lwm-*-state.json",
    "lwiki-sources.json",
    "lwm-sources.json",
    "AGENTS.md",
    "GLOBAL.md",
    "adapters/*.md",
    "adapters/*.mdc",
    "adapters/*.sh",
    "adapters/traerules",
    "adapters/adapter-manifest.json",
    "docs/migration/**",
    "knowledge-digest.html",
    "knowledge-digest.pages",
    ".codegraph",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
