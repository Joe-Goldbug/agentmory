<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Flowmory Symbol: Flow + Neural Memory + Blockchain Core -->
  <defs>
    <linearGradient id="flowGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#2a2a2a" />
    </linearGradient>
  </defs>
  
  <!-- Outer Smooth Flow Loops (Lemniscate / Flow Stream) -->
  <path d="M 32 30 
           C 18 30, 14 42, 14 50 
           C 14 58, 18 70, 32 70 
           C 44 70, 50 56, 50 50 
           C 50 44, 56 30, 68 30 
           C 82 30, 86 42, 86 50 
           C 86 58, 82 70, 68 70 
           C 56 70, 50 56, 50 50" 
        fill="none" 
        stroke="url(#flowGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Multi-Agent Neural Nodes (Workflow convergence points) -->
  <circle cx="23" cy="50" r="4.5" fill="#111111" />
  <circle cx="77" cy="50" r="4.5" fill="#111111" />

  <!-- Central Isometric Blockchain Memory Block -->
  <g transform="translate(50, 50)">
    <!-- Top Face -->
    <polygon points="0,-7 6,-3.5 0,0 -6,-3.5" fill="#111111" />
    <!-- Left Face -->
    <polygon points="-6,-3.5 0,0 0,7 -6,3.5" fill="#333333" />
    <!-- Right Face -->
    <polygon points="0,0 6,-3.5 6,3.5 0,7" fill="#222222" />
  </g>
</svg>
