[package]
name = "workmem-storage"
version = "0.1.0"
description = "Solana Anchor Program for LLM-WorkMem On-chain Provenance and Quota Storage"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "workmem_storage"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
